name: 盘中实时监控

on:
  workflow_dispatch:
    inputs:
      action:
        description: '执行动作'
        required: true
        default: 'snapshot'
        type: choice
        options:
          - snapshot
          - decision

# 独立并发组，不阻塞盘后分析
concurrency:
  group: intraday-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 随机延迟（避免固定时间访问）
        run: sleep $((RANDOM % 20))

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建必要目录
        run: |
          mkdir -p data logs reports

      - name: 打印盘中监控非敏感配置
        run: |
          echo "INTRADAY_MARKET_SNAPSHOT_ENABLED=${INTRADAY_MARKET_SNAPSHOT_ENABLED:-true}"
          echo "INTRADAY_MARKET_INDICES_CN=${INTRADAY_MARKET_INDICES_CN:-000001,399001,399006}"
          echo "INTRADAY_MARKET_INDICES_HK=${INTRADAY_MARKET_INDICES_HK:-HSI,HSTECH}"
          echo "INTRADAY_MARKET_INDICES_US=${INTRADAY_MARKET_INDICES_US:-^GSPC,^IXIC}"
          echo "REALTIME_SOURCE_PRIORITY=${REALTIME_SOURCE_PRIORITY:-tencent,akshare_sina,efinance,akshare_em}"
          echo "INTRADAY_INDEX_DATA_SOURCE=${INTRADAY_INDEX_DATA_SOURCE:-dedicated}"
          echo "INTRADAY_MIN_MARKET_INDEX_COVERAGE=${INTRADAY_MIN_MARKET_INDEX_COVERAGE:-0.0}"
          echo "INTRADAY_DATA_QUALITY_ALERT_ENABLED=${INTRADAY_DATA_QUALITY_ALERT_ENABLED:-true}"

      - name: 恢复业务数据库缓存
        uses: actions/cache@v4
        with:
          path: data/
          key: dsa-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dsa-data-${{ runner.os }}-

      - name: 数据库状态摘要
        run: |
          python - <<'PY'
          import os
          import sqlite3

          db = "data/stock_analysis.db"
          print("DB exists:", os.path.exists(db), db)
          if not os.path.exists(db):
              raise SystemExit(0)

          conn = sqlite3.connect(db)
          cur = conn.cursor()

          for table in ["analysis_history", "intraday_snapshots", "intraday_events"]:
              try:
                  cur.execute(f"SELECT COUNT(*) FROM {table}")
                  print(table, "count=", cur.fetchone()[0])
              except Exception as exc:
                  print(table, "not ready:", exc)

          try:
              cur.execute("""
                  SELECT COUNT(*)
                  FROM analysis_history
                  WHERE analysis_phase = 'postmarket'
              """)
              print("postmarket analysis_history count=", cur.fetchone()[0])
          except Exception as exc:
              print("postmarket analysis_history count not ready:", exc)

          try:
              cur.execute("""
                  SELECT code, analysis_phase, effective_trading_date, created_at
                  FROM analysis_history
                  WHERE analysis_phase = 'postmarket'
                  ORDER BY created_at DESC
                  LIMIT 10
              """)
              print("recent postmarket analysis_history:")
              for row in cur.fetchall():
                  print(row)
          except Exception as exc:
              print("postmarket analysis_history recent rows not ready:", exc)

          try:
              cur.execute("""
                  SELECT code, analysis_phase, effective_trading_date, created_at
                  FROM analysis_history
                  ORDER BY created_at DESC
                  LIMIT 10
              """)
              print("recent analysis_history:")
              for row in cur.fetchall():
                  print(row)
          except Exception as exc:
              print("analysis_history recent rows not ready:", exc)

          try:
              cur.execute("""
                  SELECT snapshot_id, status, started_at, finished_at, query_date
                  FROM intraday_snapshots
                  ORDER BY started_at DESC
                  LIMIT 5
              """)
              print("recent intraday_snapshots:")
              for row in cur.fetchall():
                  print(row)
          except Exception as exc:
              print("intraday_snapshots recent rows not ready:", exc)

          try:
              cur.execute("SELECT COUNT(*) FROM intraday_market_snapshots")
              print("intraday_market_snapshots count=", cur.fetchone()[0])
              cur.execute("""
                  SELECT query_date, market, index_code, status, current_price, change_pct, source
                  FROM intraday_market_snapshots
                  ORDER BY created_at DESC
                  LIMIT 12
              """)
              print("recent intraday_market_snapshots:")
              for row in cur.fetchall():
                  print(row)
          except Exception as exc:
              print("intraday_market_snapshots not ready:", exc)

          conn.close()
          PY

      - name: 执行盘中任务
        env:
          # AI 配置
          LITELLM_CONFIG: ${{ vars.LITELLM_CONFIG || secrets.LITELLM_CONFIG }}
          LITELLM_CONFIG_YAML: ${{ vars.LITELLM_CONFIG_YAML || secrets.LITELLM_CONFIG_YAML }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
