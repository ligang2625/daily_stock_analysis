          INTRADAY_LLM_FALLBACK_BASE_URL: ${{ vars.INTRADAY_LLM_FALLBACK_BASE_URL || secrets.INTRADAY_LLM_FALLBACK_BASE_URL }}
          INTRADAY_LLM_FALLBACK_API_KEY: ${{ secrets.INTRADAY_LLM_FALLBACK_API_KEY }}
          INTRADAY_LLM_FALLBACK_MODEL: ${{ vars.INTRADAY_LLM_FALLBACK_MODEL || secrets.INTRADAY_LLM_FALLBACK_MODEL }}
          INTRADAY_LLM_FALLBACK_TEMPERATURE: ${{ vars.INTRADAY_LLM_FALLBACK_TEMPERATURE || secrets.INTRADAY_LLM_FALLBACK_TEMPERATURE || '' }}
          INTRADAY_LLM_FALLBACK_MAX_TOKENS: ${{ vars.INTRADAY_LLM_FALLBACK_MAX_TOKENS || secrets.INTRADAY_LLM_FALLBACK_MAX_TOKENS || '' }}
          INTRADAY_LLM_FALLBACK_TIMEOUT_SEC: ${{ vars.INTRADAY_LLM_FALLBACK_TIMEOUT_SEC || secrets.INTRADAY_LLM_FALLBACK_TIMEOUT_SEC || '60' }}
          INTRADAY_LLM_FALLBACK_RETRY_ON: ${{ vars.INTRADAY_LLM_FALLBACK_RETRY_ON || secrets.INTRADAY_LLM_FALLBACK_RETRY_ON || 'config_error,rate_limited,network_error,empty_response' }}

          # 系统配置
          LOG_LEVEL: INFO
          STOCK_LIST: ${{ vars.STOCK_LIST || secrets.STOCK_LIST || '600519' }}

        run: |
          if [ -n "$LITELLM_CONFIG_YAML" ] && [ -n "$LITELLM_CONFIG" ]; then
            echo "使用 GitHub Actions Secrets/Variables 中的 LITELLM_CONFIG_YAML 配置"
            mkdir -p "$(dirname "$LITELLM_CONFIG")"
            echo "$LITELLM_CONFIG_YAML" > "$LITELLM_CONFIG"
            echo "LITELLM 配置文件已写入: $LITELLM_CONFIG"
          fi

          # 判断执行动作：手动触发用输入参数，定时触发用 UTC 时间
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ github.event.inputs.action }}"
          else
            UTC_HOUR=$(date +%H)
            if [ "$UTC_HOUR" -ge "6" ] && [ "$UTC_HOUR" -lt "7" ]; then
              ACTION="decision"
            else
              ACTION="snapshot"
            fi
          fi

          echo "=========================================="
          echo "盘中监控 — $ACTION"
          echo "北京时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "监控股票: $INTRADAY_MONITOR_STOCKS"
          echo "=========================================="

          if [ "$ACTION" = "decision" ]; then
            TODAY=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
            RECOVERED=$(sqlite3 data/stock_analysis.db "SELECT COUNT(*) FROM intraday_snapshots WHERE query_date='$TODAY';" 2>/dev/null || echo "0")
            echo "Recovered snapshots (today=$TODAY): $RECOVERED"
            python main.py --intraday-decision
          else
            python main.py --intraday-snapshot
          fi

      - name: 上传运行日志
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: intraday-${{ github.run_number }}
          path: |
            logs/
            data/stock_analysis.db
          retention-days: 3
